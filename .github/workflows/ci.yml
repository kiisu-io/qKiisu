name: 'CI'

on:
  push:

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - name: 'Wipe workspace'
        run: find ./ -mount -maxdepth 1 -exec rm -rf {} \;

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: false
          context: docker
          tags: qkiisu-build:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build application in docker
        run: docker run --rm --privileged -v $(pwd):/project qkiisu-build:latest /project/build_linux.sh

      - name: Publish application
        uses: actions/upload-artifact@v4
        with:
          name: qKiisu-x86_64.AppImage
          path: |
                ./build/qKiisu-x86_64.AppImage
          if-no-files-found: error
          retention-days: 1

  build_mac:
    runs-on: [self-hosted, ARM64, macOS, qKiisu]
    env:
      MAC_OS_KEYCHAIN_NAME: ${{ secrets.MAC_OS_KEYCHAIN_NAME }}
      MAC_OS_KEYCHAIN_PASSWORD: ${{ secrets.MAC_OS_KEYCHAIN_PASSWORD }}
      MAC_OS_SIGNING_KEY_ID: ${{ secrets.MAC_OS_SIGNING_KEY_ID }}
      MAC_OS_SIGNING_TEAM_ID: ${{ secrets.MAC_OS_SIGNING_TEAM_ID }}
      MAC_OS_SIGNING_USERNAME: ${{ secrets.MAC_OS_SIGNING_USERNAME }}
      MAC_OS_SIGNING_PASSWORD: ${{ secrets.MAC_OS_SIGNING_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build application
        run: ./build_mac.sh

      - name: Publish application
        uses: actions/upload-artifact@v4
        with:
          name: qkiisu.dmg
          path: |
            ./build_mac/qkiisu.dmg
          if-no-files-found: error
          retention-days: 1

  build_windows:
    runs-on: [self-hosted, X64, Windows]
    env:
        SIGNING_TOOL: ${{ secrets.WIN_SIGNING_TOOL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # must to be there, see installer_windows.nsi file for details

      - name: Build application
        run: .\build_windows.bat

      - name: Publish application
        uses: actions/upload-artifact@v4
        with:
          name: qKiisuSetup-64bit.exe
          path: |
            .\build\qKiisuSetup-64bit.exe
            .\build\qKiisu-64bit.zip
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Upload apps to storage
    needs: [build_windows, build_mac, build_linux]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Make artifacts directory'
        run: |
          test -d artifacts && rm -rf artifacts || true
          mkdir artifacts

      - name: 'Generate tag suffix'
        if: startsWith(github.ref, 'refs/tags/') == true
        run: |
          echo "REF=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          echo "SUFFIX=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

      - name: 'Generate branch suffix'
        if: startsWith(github.ref, 'refs/tags/') != true
        run: |
          echo "REF=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
          echo "SUFFIX=$(git rev-parse --abbrev-ref HEAD | sed 's/\//_/g')-$(date +'%d%m%Y')-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: qKiisu-x86_64.AppImage
      - uses: actions/download-artifact@v4
        with:
          name: qKiisuSetup-64bit.exe
      - uses: actions/download-artifact@v4
        with:
          name: qkiisu.dmg

      - name: Rename app
        run: |
            mv qKiisu-x86_64.AppImage ./artifacts/qKiisu-x86_64-${SUFFIX}.AppImage
            mv qKiisuSetup-64bit.exe ./artifacts/qKiisuSetup-64bit-${SUFFIX}.exe
            mv qKiisu-64bit.zip ./artifacts/qKiisu-64bit-${SUFFIX}.zip
            mv qkiisu.dmg ./artifacts/qKiisu-${SUFFIX}.dmg

      - name: Upload artifacts to update server
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: |
          FILES=$(for CUR in $(ls artifacts/); do echo "-F files=@artifacts/$CUR"; done)
          curl --fail -L -H "Token: ${{ secrets.INDEXER_TOKEN }}" \
              -F "branch=${REF}" \
              ${FILES[@]} \
              "${{ secrets.INDEXER_URL }}"/qKiisu/uploadfiles
