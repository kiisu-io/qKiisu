name: 'CI'

on:
  push:
  workflow_dispatch:

env:
  QT_VERSION: '6.4.2'

jobs:
  build_linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport qt5compat qtshadertools

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libusb-1.0-0-dev \
            libfuse2 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xfixes0 \
            libxcb-cursor0 \
            libxcb-shape0

      - name: Install linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O /usr/local/bin/linuxdeploy && chmod +x /usr/local/bin/linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -O /usr/local/bin/linuxdeploy-plugin-qt && chmod +x /usr/local/bin/linuxdeploy-plugin-qt

      - name: Build
        run: |
          mkdir build && cd build
          qmake ../qKiisu.pro -spec linux-g++ "CONFIG+=release qtquickcompiler" PREFIX="$PWD/AppDir/usr"
          make qmake_all
          make -j$(nproc)
          make install

      - name: Deploy plugin
        run: |
          cd build
          mkdir -p AppDir/usr/lib/qKiisu/plugins
          cp libflipperproto0.so AppDir/usr/lib/qKiisu/plugins/ || cp plugins/libflipperproto0.so AppDir/usr/lib/qKiisu/plugins/ || true

      - name: Create AppImage
        run: |
          cd build
          export OUTPUT="qKiisu-x86_64.AppImage"
          linuxdeploy --appdir=AppDir -o appimage \
            --custom-apprun="../installer-assets/appimage/AppRun" \
            --exclude-library="libwayland*" \
            --exclude-library="libxcb*" \
            --exclude-library="libxkb*" \
            --exclude-library="libX*"

      - name: Publish application
        uses: actions/upload-artifact@v4
        with:
          name: qKiisu-x86_64.AppImage
          path: build/qKiisu-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  build_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          modules: qtserialport qt5compat qtshadertools

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          mkdir build && cd build
          qmake ..\qKiisu.pro -spec win32-msvc "CONFIG+=release qtquickcompiler"
          nmake qmake_all
          nmake

      - name: Deploy
        shell: cmd
        run: |
          cd build
          mkdir qKiisu\plugins
          copy qKiisu.exe qKiisu\
          copy qKiisu-cli.exe qKiisu\
          copy plugins\flipperproto0.dll qKiisu\plugins\
          cd qKiisu
          windeployqt --release --no-compiler-runtime --qmldir %GITHUB_WORKSPACE%\application qKiisu.exe
          windeployqt --release --no-compiler-runtime qKiisu-cli.exe

      # TODO: Enable Windows cloud code signing when certificate is ready
      # - name: Sign executables
      #   if: secrets.SIGNING_CERT != ''
      #   run: ...

      - name: Package zip
        shell: cmd
        run: |
          cd build
          tar -a -cf qKiisu-64bit.zip qKiisu\*

      - name: Build installer (NSIS)
        shell: cmd
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS\makensis.exe" /DNAME=qKiisu /DARCH_BITS=64 installer_windows.nsi

      - name: Publish application
        uses: actions/upload-artifact@v4
        with:
          name: qKiisu-Windows-64bit
          path: |
            build/qKiisu-64bit.zip
            build/qKiisuSetup-64bit.exe
          if-no-files-found: error
          retention-days: 7

  build_mac:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport qt5compat qtshadertools

      - name: Install dependencies
        run: brew install libusb

      - name: Build
        run: |
          mkdir build_mac && cd build_mac
          qmake ../qKiisu.pro -spec macx-clang "CONFIG+=release qtquickcompiler"
          make qmake_all
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Bundle plugin
        run: |
          cd build_mac
          mkdir -p qKiisu.app/Contents/PlugIns
          cp libflipperproto0.dylib qKiisu.app/Contents/PlugIns/ || cp plugins/libflipperproto0.dylib qKiisu.app/Contents/PlugIns/ || true

      - name: Bundle libusb
        run: |
          cd build_mac
          mkdir -p qKiisu.app/Contents/Frameworks
          cp $(brew --prefix libusb)/lib/libusb-1.0.0.dylib qKiisu.app/Contents/Frameworks/

          install_name_tool -id \
            "@loader_path/libusb-1.0.0.dylib" \
            qKiisu.app/Contents/Frameworks/libusb-1.0.0.dylib

          for bin in qKiisu.app/Contents/MacOS/qKiisu qKiisu.app/Contents/MacOS/qKiisu-cli; do
            if [ -f "$bin" ]; then
              LIBUSB_PATH=$(otool -L "$bin" | grep libusb | awk '{print $1}')
              if [ -n "$LIBUSB_PATH" ]; then
                install_name_tool -change "$LIBUSB_PATH" \
                  "@loader_path/../Frameworks/libusb-1.0.0.dylib" "$bin"
              fi
            fi
          done

      # TODO: Enable macOS code signing when Apple Developer certificate is ready
      # - name: Sign application
      #   if: secrets.MAC_OS_SIGNING_KEY_ID != ''
      #   run: codesign --force --options=runtime -s "${{ secrets.MAC_OS_SIGNING_KEY_ID }}" --deep -v build_mac/qKiisu.app

      - name: Create DMG
        run: |
          pip3 install --break-system-packages dmgbuild
          cd build_mac
          dmgbuild \
            -s "../installer-assets/macos/dmgbuild-config.py" \
            -D "app=qKiisu.app" \
            "qKiisu-$(git describe --tags --abbrev=0 2>/dev/null || echo dev)" \
            qKiisu.dmg

      - name: Publish application
        uses: actions/upload-artifact@v4
        with:
          name: qKiisu-macOS
          path: build_mac/qKiisu.dmg
          if-no-files-found: error
          retention-days: 7
