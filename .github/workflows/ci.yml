name: 'CI'

on:
  push:
  workflow_dispatch:

env:
  QT_VERSION: '6.4.2'

jobs:
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - name: 'Wipe workspace'
        run: find ./ -mount -maxdepth 1 -exec rm -rf {} \;

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          push: false
          context: docker
          tags: qkiisu-build:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build application in docker
        run: docker run --rm --privileged -v $(pwd):/project qkiisu-build:latest /project/build_linux.sh

      - name: Publish application
        uses: actions/upload-artifact@v4
        with:
          name: qKiisu-x86_64.AppImage
          path: ./build/qKiisu-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  build_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          modules: qtserialport qt5compat qtshadertools qtsvg

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          qmake qKiisu.pro -spec win32-msvc "CONFIG+=release qtquickcompiler"
          nmake qmake_all
          nmake

      - name: Deploy
        shell: cmd
        run: |
          mkdir dist\qKiisu
          copy release\qKiisu.exe dist\qKiisu\
          copy release\qKiisu-cli.exe dist\qKiisu\
          if exist release\plugins\flipperproto0.dll copy release\plugins\flipperproto0.dll dist\qKiisu\plugins\
          cd dist\qKiisu
          windeployqt --release --no-compiler-runtime --qmldir %GITHUB_WORKSPACE%\application qKiisu.exe
          windeployqt --release --no-compiler-runtime qKiisu-cli.exe

      # TODO: Enable Windows code signing when cloud signing certificate is ready
      # - name: Sign executables
      #   if: env.SIGNING_ENABLED == 'true'
      #   shell: cmd
      #   run: |
      #     signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\qKiisu\qKiisu.exe
      #     signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\qKiisu\qKiisu-cli.exe

      - name: Package zip
        shell: cmd
        run: |
          cd dist
          tar -a -cf %GITHUB_WORKSPACE%\qKiisu-64bit.zip qKiisu\*

      - name: Install NSIS
        shell: cmd
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: cmd
        run: |
          "%programfiles(x86)%\NSIS\makensis.exe" /DNAME=qKiisu /DARCH_BITS=64 installer_windows.nsi

      - name: Publish application
        uses: actions/upload-artifact@v4
        with:
          name: qKiisu-Windows-64bit
          path: |
            build/qKiisuSetup-64bit.exe
            qKiisu-64bit.zip
          if-no-files-found: warn
          retention-days: 7

  build_mac:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport qt5compat qtshadertools qtsvg

      - name: Install dependencies
        run: brew install libusb

      - name: Build
        run: |
          mkdir build_mac && cd build_mac
          qmake ../qKiisu.pro -spec macx-clang "CONFIG+=release qtquickcompiler"
          make qmake_all
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Bundle libusb
        run: |
          cd build_mac
          mkdir -p qKiisu.app/Contents/Frameworks
          cp $(brew --prefix libusb)/lib/libusb-1.0.0.dylib qKiisu.app/Contents/Frameworks/

          # Fix libusb rpaths
          install_name_tool -change \
            "$(otool -L qKiisu.app/Contents/MacOS/qKiisu | grep libusb | awk '{print $1}')" \
            "@loader_path/../Frameworks/libusb-1.0.0.dylib" \
            qKiisu.app/Contents/MacOS/qKiisu

          if [ -f qKiisu.app/Contents/MacOS/qKiisu-cli ]; then
            install_name_tool -change \
              "$(otool -L qKiisu.app/Contents/MacOS/qKiisu-cli | grep libusb | awk '{print $1}')" \
              "@loader_path/../Frameworks/libusb-1.0.0.dylib" \
              qKiisu.app/Contents/MacOS/qKiisu-cli
          fi

          install_name_tool -id \
            "@loader_path/libusb-1.0.0.dylib" \
            qKiisu.app/Contents/Frameworks/libusb-1.0.0.dylib

      # TODO: Enable macOS code signing when Apple Developer certificate is ready
      # - name: Sign application
      #   if: env.SIGNING_ENABLED == 'true'
      #   env:
      #     MAC_OS_SIGNING_KEY_ID: ${{ secrets.MAC_OS_SIGNING_KEY_ID }}
      #   run: |
      #     codesign --force --options=runtime -s "$MAC_OS_SIGNING_KEY_ID" --deep -v build_mac/qKiisu.app

      - name: Create DMG
        run: |
          cd build_mac
          pip3 install dmgbuild
          dmgbuild \
            -s "../installer-assets/macos/dmgbuild-config.py" \
            -D "app=qKiisu.app" \
            "qKiisu-$(git describe --tags --abbrev=0 2>/dev/null || echo dev)" \
            qKiisu.dmg

      - name: Publish application
        uses: actions/upload-artifact@v4
        with:
          name: qKiisu-macOS
          path: build_mac/qKiisu.dmg
          if-no-files-found: warn
          retention-days: 7
